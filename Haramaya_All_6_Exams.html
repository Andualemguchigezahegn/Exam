let currentExam = 1;
let seconds = 0;
let timerInterval;

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    seconds++;
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  document.getElementById('timer').textContent = m + ':' + s;
}

function switchExam(num) {
  currentExam = num;
  document.querySelectorAll('.btn-exam').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.btn-exam')[num - 1].classList.add('active');
  renderExam();
  startTimer();
  document.getElementById('scoreBanner').style.display = 'none';
}

function renderExam() {
  const data = ALL_EXAMS[currentExam];
  const root = document.getElementById('examRoot');
  let html = '';

  // T/F
  html += '<div class="section-header">Part I: True or False (Questions 1–10)</div>';
  data.tf.forEach((item, idx) => {
    html += `
      <div class="q-card" id="card-tf-${idx}">
        <div class="q-title">${idx + 1}. ${item.q}</div>
        <label class="opt-label"><input type="radio" name="tf_${idx}" value="true" onchange="updateProgress()"> True</label>
        <label class="opt-label"><input type="radio" name="tf_${idx}" value="false" onchange="updateProgress()"> False</label>
        <div class="feedback" id="fb-tf-${idx}"></div>
      </div>`;
  });

  // FIB
  html += '<div class="section-header">Part II: Fill in the Blank Space (Questions 11–17)</div>';
  data.fib.forEach((item, idx) => {
    html += `
      <div class="q-card" id="card-fib-${idx}">
        <div class="q-title">${idx + 11}. ${item.q}</div>
        <input type="text" class="fib-input" id="inp-fib-${idx}" placeholder="Type your answer here..." oninput="updateProgress()">
        <div class="feedback" id="fb-fib-${idx}"></div>
      </div>`;
  });

  // MCQ
  html += '<div class="section-header">Part III: Multiple Choice Questions (Questions 18–50)</div>';
  data.mcq.forEach((item, idx) => {
    html += `<div class="q-card" id="card-mcq-${idx}"><div class="q-title">${idx + 18}. ${item.q}</div>`;
    if (item.table) html += item.table;
    item.opts.forEach((optText, oIdx) => {
      const letter = ['A', 'B', 'C', 'D'][oIdx];
      html += `<label class="opt-label"><input type="radio" name="mcq_${idx}" value="${letter}" onchange="updateProgress()"> <strong>${letter})</strong> ${optText}</label>`;
    });
    html += `<div class="feedback" id="fb-mcq-${idx}"></div></div>`;
  });

  root.innerHTML = html;
  updateProgress();
}

function updateProgress() {
  const data = ALL_EXAMS[currentExam];
  let answered = 0;
  data.tf.forEach((_, idx) => { if (document.querySelector(`input[name="tf_${idx}"]:checked`)) answered++; });
  data.fib.forEach((_, idx) => { if (document.getElementById(`inp-fib-${idx}`).value.trim().length > 0) answered++; });
  data.mcq.forEach((_, idx) => { if (document.querySelector(`input[name="mcq_${idx}"]:checked`)) answered++; });
  document.getElementById('progressText').innerHTML = `Answered: ${answered} / 50 &nbsp;|&nbsp; Timer: <span id="timer">${document.getElementById('timer').textContent}</span>`;
}

function gradeExam() {
  const data = ALL_EXAMS[currentExam];
  let tfScore = 0, fibScore = 0, mcqScore = 0;

  data.tf.forEach((item, idx) => {
    const card = document.getElementById(`card-tf-${idx}`);
    const fb = document.getElementById(`fb-tf-${idx}`);
    const sel = document.querySelector(`input[name="tf_${idx}"]:checked`);
    card.classList.remove('correct', 'wrong');
    const correctStr = item.ans ? 'True' : 'False';
    if (sel && (sel.value === String(item.ans))) {
      tfScore++; card.classList.add('correct');
      fb.innerHTML = `<strong>✔ Correct (${correctStr}):</strong> ${item.exp}`;
    } else {
      card.classList.add('wrong');
      fb.innerHTML = `<strong>✘ Incorrect — Correct: ${correctStr}.</strong> ${item.exp}`;
    }
    fb.classList.add('show');
  });

  data.fib.forEach((item, idx) => {
    const card = document.getElementById(`card-fib-${idx}`);
    const fb = document.getElementById(`fb-fib-${idx}`);
    const rawVal = document.getElementById(`inp-fib-${idx}`).value.trim().toLowerCase().replace(/\s+/g, ' ');
    card.classList.remove('correct', 'wrong');
    const isMatch = item.ans.some(a => rawVal === a || (a.length > 4 && rawVal.includes(a)));
    if (rawVal.length > 0 && isMatch) {
      fibScore++; card.classList.add('correct');
      fb.innerHTML = `<strong>✔ Correct (${item.display_ans}):</strong> ${item.exp}`;
    } else {
      card.classList.add('wrong');
      fb.innerHTML = `<strong>✘ Incorrect — Correct: ${item.display_ans}.</strong> ${item.exp}`;
    }
    fb.classList.add('show');
  });

  data.mcq.forEach((item, idx) => {
    const card = document.getElementById(`card-mcq-${idx}`);
    const fb = document.getElementById(`fb-mcq-${idx}`);
    const sel = document.querySelector(`input[name="mcq_${idx}"]:checked`);
    card.classList.remove('correct', 'wrong');
    if (sel && sel.value === item.ans) {
      mcqScore++; card.classList.add('correct');
      fb.innerHTML = `<strong>✔ Correct (${item.ans}):</strong> ${item.exp}`;
    } else {
      card.classList.add('wrong');
      fb.innerHTML = `<strong>✘ Incorrect — Correct: ${item.ans}.</strong> ${item.exp}`;
    }
    fb.classList.add('show');
  });

  const total = tfScore + fibScore + mcqScore;
  const pct = Math.round((total / 50) * 100);
  document.getElementById('totalScoreText').textContent = `Total Score: ${total} / 50 (${pct}%)`;
  document.getElementById('breakdownText').innerHTML = `
    <span>True/False: ${tfScore} / 10</span>
    <span>Fill-in-Blank: ${fibScore} / 7</span>
    <span>Multiple Choice: ${mcqScore} / 33</span>
  `;
  document.getElementById('scoreBanner').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetExam() {
  renderExam();
  startTimer();
  document.getElementById('scoreBanner').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize
renderExam();
startTimer();
</script>
